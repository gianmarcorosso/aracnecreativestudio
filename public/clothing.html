<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CLOTHING — ARACNE CREATIVE STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/clothing.css">
</head>
<body>

    <header>
        <a href="/" class="nav-left">
            <img src="/logo-spider.png" alt="Aracne">
        </a>
        <a href="/" class="nav-center">ARACNE CREATIVE STUDIO</a>
        <div class="nav-right">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
        </div>
    </header>

    <main>
        <div class="grid">

            <div class="product">
                <a href="/product?id=hooded-bomber" class="product-img-wrap">
                    <img src="/bomber.png" alt="Hooded Bomber">
                </a>
                <span class="product-name">Hooded Bomber</span>
            </div>

            <div class="product">
                <a href="/product?id=hoodie-jacket" class="product-img-wrap">
                    <img src="/hoodiejacket.png" alt="Hoodie Jacket">
                </a>
                <span class="product-name">Hoodie Jacket</span>
            </div>

            <div class="product">
                <a href="/product?id=oversized-tee" class="product-img-wrap">
                    <img src="/tshirt.png" alt="Oversized Tee">
                </a>
                <span class="product-name">Oversized Tee</span>
            </div>

            <div class="product">
                <a href="/product?id=oversized-tee-black" class="product-img-wrap">
                    <img src="/thisrtblk.png" alt="Oversized Tee Black">
                </a>
                <span class="product-name">Oversized Tee Black</span>
            </div>

            <div class="product">
                <a href="/product?id=relaxed-pants" class="product-img-wrap">
                    <img src="/pants.png" alt="Relaxed Pants">
                </a>
                <span class="product-name">Relaxed Pants</span>
            </div>

            <div class="product">
                <a href="/product?id=relaxed-pants-ii" class="product-img-wrap">
                    <img src="/pants2.png" alt="Relaxed Pants II">
                </a>
                <span class="product-name">Relaxed Pants II</span>
            </div>

            <div class="product">
                <a href="/product?id=leather-bag" class="product-img-wrap">
                    <img src="/bag.png" alt="Leather Bag">
                </a>
                <span class="product-name">Leather Bag</span>
            </div>

        </div>
    </main>

</body>
</html>
