<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — ARACNE CREATIVE STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/product.css">
</head>
<body>

    <header>
        <a href="/clothing" class="nav-back">&#8249;</a>
        <div class="nav-right">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
                <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 01-8 0"/>
            </svg>
        </div>
    </header>

    <main>
        <button class="arrow arrow-prev" id="prevBtn">&#8249;</button>

        <div class="slider" id="slider">
            <!-- images injected by JS -->
        </div>

        <button class="arrow arrow-next" id="nextBtn">&#8250;</button>
    </main>

    <footer>
        <div class="dots" id="dots"></div>
        <h1 class="product-name" id="productName"></h1>
        <p class="product-price" id="productPrice"></p>
        <button class="add-btn">+</button>
    </footer>

    <script src="/product.js"></script>
</body>
</html>
