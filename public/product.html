<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — ARACNE CREATIVE STUDIO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/product.css">
    <link rel="stylesheet" href="/shop.css">
</head>
<body>

    <header>
        <a href="/clothing" class="nav-back">&#8249;</a>
        <div class="nav-right"></div>
    </header>

    <main>
        <button class="arrow arrow-prev" id="prevBtn">&#8249;</button>

        <div class="slider" id="slider">
            <!-- images injected by JS -->
        </div>

        <button class="arrow arrow-next" id="nextBtn">&#8250;</button>
    </main>

    <footer>
        <div class="dots" id="dots"></div>
        <h1 class="product-name" id="productName"></h1>
        <p class="product-price" id="productPrice"></p>
        <div class="size-picker" id="sizePicker"></div>
        <button class="add-btn" id="addBtn" aria-label="Add to bag">+</button>
        <p class="add-status" id="addStatus" aria-live="polite"></p>
    </footer>

    <script src="/shop.js"></script>
    <script src="/product.js"></script>
</body>
</html>
